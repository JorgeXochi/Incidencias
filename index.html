<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xochi · Incidencias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Paleta tomada del tag Xochi: verde de la tarjeta y azul del logotipo */
  :root {
    --green:#4d9242; --green-d:#3b7a32; --green-l:#e8f3e5; --green-b:#b9d3b4;
    --blue:#0b3191;  --blue-d:#012789;  --blue-l:#e6edfa;  --blue-b:#c3d2f1;
    --bg:#f1f6f1; --card:#fff; --txt:#1f2937; --muted:#5b6b5b;
    --err:#dc2626; --err-d:#b91c1c; --ok:#3b7a32;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }

  /* ---------- Encabezado con el tag Xochi ---------- */
  header { position:relative; background:#fff; padding:8px 20px 11px; display:flex; justify-content:space-between; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--green),var(--blue)); }
  header .brand { height:58px; width:auto; display:block; }
  header #userBox { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; font-size:14px; color:var(--blue-d); font-weight:600; }

  /* Etiqueta de rol */
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge-admin { background:var(--blue); color:#fff; }
  .badge-user { background:var(--green-l); color:var(--green-d); border:1px solid var(--green-b); }

  main { max-width:1100px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.1); margin-bottom:20px; }
  h2 { margin-top:0; font-size:17px; color:var(--blue); }
  label { display:block; font-size:13px; font-weight:600; color:var(--green-d); margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:9px 10px; border:1px solid var(--green-b); border-radius:6px; font:inherit; background:#fff; color:var(--txt); }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(77,146,66,.25); }
  input[readonly] { background:var(--blue-l); border-color:var(--blue-b); color:var(--blue); font-weight:700; }
  select:disabled { background:#f3f4f6; color:#6b7280; }
  td select { min-width:150px; padding:7px 8px; }
  textarea { min-height:90px; resize:vertical; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .row-one { grid-template-columns:minmax(0,340px); }

  /* Tarjeta del formulario: franja verde → azul arriba */
  .form-card::before { content:""; display:block; height:6px; margin:-20px -20px 16px; border-radius:10px 10px 0 0; background:linear-gradient(90deg,var(--green),var(--blue)); }

  /* ---------- Botones ---------- */
  button { background:var(--green); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { background:var(--green-d); }
  button.sec { background:#e5e7eb; color:var(--txt); }
  button.sec:hover { background:#d1d5db; }
  button.link { background:none; color:var(--blue); padding:0; text-decoration:underline; }
  button.btn-edit { background:var(--blue); padding:7px 12px; font-size:13px; }
  button.btn-edit:hover { background:var(--blue-d); }
  button.btn-del { background:var(--err); padding:7px 12px; font-size:13px; }
  button.btn-del:hover { background:var(--err-d); }
  .actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg { margin-top:10px; font-size:14px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }

  /* ---------- Tabla ---------- */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #e5e7eb; vertical-align:top; }
  th { background:var(--green-l); color:var(--green-d); font-weight:700; border-bottom:2px solid var(--green); }
  tbody tr:hover { background:#f6fbf5; }
  td.det { max-width:320px; white-space:pre-wrap; word-break:break-word; }
  td.acts { white-space:nowrap; }
  td.acts button + button { margin-left:6px; }
  td.empty { color:var(--muted); }
  .tablewrap { overflow-x:auto; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .top input { max-width:280px; }
  .tag { font-family:ui-monospace, Menlo, monospace; font-weight:700; color:var(--blue); }
  .me { color:var(--muted); font-weight:400; }

  .auth-card {
    width:100%; max-width:380px; padding:28px 24px; border-radius:14px; color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  .auth-card h2 { color:#fff; text-align:center; font-size:21px; margin-bottom:8px; }
  .auth-card label { color:rgba(255,255,255,.88); font-weight:400; }
  .auth-card input { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.35); color:#fff; }
  .auth-card input::placeholder { color:rgba(255,255,255,.6); }
  .auth-card input:focus { outline:2px solid rgba(255,255,255,.75); outline-offset:0; box-shadow:none; background:rgba(255,255,255,.2); }
  .auth-card input:-webkit-autofill {
    -webkit-text-fill-color:#fff; caret-color:#fff;
    -webkit-box-shadow:0 0 0 1000px rgba(40,40,40,.65) inset;
  }
  .auth-card button.link { color:#fff; }
  .auth-card .msg.err { color:#fecaca; }
  .auth-card .msg.ok { color:#bbf7d0; }

  /* ---------- Barra de navegación (solo administrador) ---------- */
  #adminNav { background:#fff; border-bottom:1px solid var(--green-b); padding:0 20px; display:flex; gap:4px; overflow-x:auto; }
  #adminNav button { background:none; color:var(--muted); border:0; border-bottom:3px solid transparent; border-radius:0; padding:13px 16px 10px; font-weight:600; white-space:nowrap; }
  #adminNav button:hover { background:var(--green-l); color:var(--green-d); }
  #adminNav button.active { color:var(--blue); border-bottom-color:var(--blue); background:var(--blue-l); }
  @media (max-width:600px) {
    #adminNav { display:grid; grid-template-columns:repeat(4,1fr); gap:0; padding:0 4px; overflow-x:visible; }
    #adminNav button { white-space:normal; text-align:center; font-size:12px; line-height:1.2; padding:10px 2px 8px; }
  }

  /* ---------- Carriles ---------- */
  .top select { max-width:220px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .chip { background:var(--blue-l); color:var(--blue); border:1px solid var(--blue-b); border-radius:999px; padding:4px 12px; font-size:13px; }
  .chip b { color:var(--blue-d); }

  .hidden { display:none !important; }
</style>
</head>

<!-- ===================== APP ===================== -->
<main id="appView" class="hidden">

  <div class="card form-card" id="viewNueva">
    <h2 id="formTitle">Nueva incidencia</h2>
    <form id="incForm">
      <div class="row">
        <div>
          <label>Correlativo (automático, no editable)</label>
          <input id="fCorrelativo" readonly value="Se asigna al guardar">
        </div>
        <div>
          <label>Fecha y hora</label>
          <input id="fFecha" readonly>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="fNombre">Nombre</label>
          <input id="fNombre" required maxlength="80">
        </div>
        <div>
          <label for="fApellido">Apellido</label>
          <input id="fApellido" required maxlength="80">
        </div>
        <div>
          <label for="fPuesto">Puesto</label>
          <input id="fPuesto" required maxlength="100">
        </div>
      </div>
      <div class="row row-one">
        <div>
          <label for="fGarita">Garita</label>
          <select id="fGarita" required>
            <option value="">Selecciona una garita</option>
            <option value="Garita 1">Garita 1</option>
            <option value="Garita 2">Garita 2</option>
            <option value="Garita 3">Garita 3</option>
            <option value="Garita 4">Garita 4</option>
          </select>
        </div>
      </div>
      <label for="fIncidencia">Título de Incidencia</label>
      <input id="fIncidencia" required maxlength="150" placeholder="Ej: barrera, antena, télefono…">
      <label for="fDetalle">Detalle de la incidencia</label>
      <textarea id="fDetalle" placeholder="Describe lo ocurrido con el mayor detalle posible"></textarea>
      <div class="actions">
        <button type="submit" id="btnGuardar">Guardar incidencia</button>
        <button type="button" class="sec hidden" id="btnCancelar">Cancelar edición</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </form>
  </div>

  <div class="card" id="viewTodas">
    <div class="top">
      <h2 id="tituloLista" style="margin:0">Mis incidencias</h2>
      <input id="buscar" type="search" placeholder="Buscar nombre, garita, título…">
    </div>
    <div class="tablewrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="listMsg" class="msg"></div>
  </div>

  <!-- Solo administradores: carriles de cada garita -->
  <div id="viewCarriles" class="hidden">
    <div class="card form-card">
      <h2>Agregar carril</h2>
      <form id="carForm">
        <div class="row">
          <div>
            <label for="cNombre">Nombre del carril</label>
            <input id="cNombre" required maxlength="60" placeholder="Ej: Carril 1">
          </div>
          <div>
            <label for="cGarita">Garita a la que pertenece</label>
            <select id="cGarita" required>
              <option value="">Selecciona una garita</option>
              <option value="Garita 1">Garita 1</option>
              <option value="Garita 2">Garita 2</option>
              <option value="Garita 3">Garita 3</option>
              <option value="Garita 4">Garita 4</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="btnAddCarril">Agregar carril</button>
        </div>
        <div id="carFormMsg" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <div class="top">
        <h2 style="margin:0">Carriles registrados</h2>
        <select id="cFiltro" aria-label="Filtrar por garita">
          <option value="">Todas las garitas</option>
          <option value="Garita 1">Garita 1</option>
          <option value="Garita 2">Garita 2</option>
          <option value="Garita 3">Garita 3</option>
          <option value="Garita 4">Garita 4</option>
        </select>
      </div>
      <div id="cResumen" class="chips"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Garita</th><th>Carril</th><th>Fecha de registro</th><th>Funciones</th></tr></thead>
          <tbody id="cbody"></tbody>
        </table>
      </div>
      <div id="carMsg" class="msg"></div>
    </div>
  </div>

  <!-- Solo administradores -->
  <div class="card hidden" id="usersCard">
    <h2>Usuarios y roles</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Correo</th><th>Rol</th><th></th></tr></thead>
        <tbody id="ubody"></tbody>
      </table>
    </div>
    <div id="usersMsg" class="msg"></div>
  </div>
</main>

<script>
/* ============ CONFIGURACIÓN: pega aquí los datos de tu proyecto ============ */
const SUPABASE_URL = "https://ejpxpcrmrmqfpcjrduve.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqcHhwY3Jtcm1xZnBjanJkdXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDY0NjQsImV4cCI6MjEwNzA4MjQ2NH0.vGXKboW4oA9EdqmA_TAw0eZwrhAzRhLyxyF34689BGA";
/* ========================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let modoRegistro = false;
let datos = [];
let perfiles = [];
let carriles = [];
let editando = null;        // correlativo en edición (solo admin)
let miRol = "usuario";      // "usuario" | "admin"
let usuarioActual = null;   // id del usuario con sesión

const esAdmin = () => miRol === "admin";

/* ---------- Navegación del administrador ---------- */
function irA(vista) {
  if (!esAdmin()) return;
  $("viewNueva").classList.toggle("hidden", vista !== "nueva");
  $("viewTodas").classList.toggle("hidden", vista !== "todas");
  $("viewCarriles").classList.toggle("hidden", vista !== "carriles");
  $("usersCard").classList.toggle("hidden", vista !== "usuarios");
  document.querySelectorAll("#adminNav button").forEach(b => {
    const activo = b.dataset.view === vista;
    b.classList.toggle("active", activo);
    if (activo) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (vista === "usuarios") cargarUsuarios();   // siempre la lista actualizada
  if (vista === "carriles") cargarCarriles();
  window.scrollTo({ top: 0 });
}

$("adminNav").onclick = e => {
  const b = e.target.closest("[data-view]");
  if (!b) return;
  // "Nueva incidencia" siempre abre el formulario en blanco (si estabas editando, se descarta)
  if (b.dataset.view === "nueva" && editando !== null) { cancelarEdicion(); msg($("formMsg"), ""); }
  irA(b.dataset.view);
};
const fmtCorrelativo = n => "Tick-" + String(n).padStart(6, "0");
const fmtFecha = iso => new Date(iso).toLocaleString("es-GT", { dateStyle: "short", timeStyle: "medium" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const msg = (el, texto, tipo) => { el.textContent = texto; el.className = "msg " + (tipo || ""); };

/* ---------- Autenticación ---------- */
$("authToggle").onclick = () => {
  modoRegistro = !modoRegistro;
  $("authTitle").textContent = modoRegistro ? "Crear cuenta" : "Iniciar sesión";
  $("authSubmit").textContent = modoRegistro ? "Registrarme" : "Entrar";
  $("authToggle").textContent = modoRegistro ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate";
  $("password").autocomplete = modoRegistro ? "new-password" : "current-password";
  msg($("authMsg"), "");
};

$("authForm").onsubmit = async e => {
  e.preventDefault();
  msg($("authMsg"), "Procesando…");
  const email = $("email").value.trim(), password = $("password").value;
  if (modoRegistro) {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return msg($("authMsg"), error.message, "err");
    if (!data.session) msg($("authMsg"), "Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.", "ok");
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return msg($("authMsg"), "Correo o contraseña incorrectos.", "err");
  }
};

$("btnLogout").onclick = () => sb.auth.signOut();

// setTimeout evita un bloqueo de supabase-js al consultar datos dentro de este callback
sb.auth.onAuthStateChange((_evt, session) => { setTimeout(() => mostrarVista(session), 0); });
sb.auth.getSession().then(({ data }) => mostrarVista(data.session));

async function mostrarVista(session) {
  const uid = session ? session.user.id : null;
  if (uid === usuarioActual) return;   // el token se renueva solo: no reiniciar la pantalla
  usuarioActual = uid;

  if (!session) {
    miRol = "usuario"; datos = []; perfiles = []; editando = null;
    $("tbody").innerHTML = ""; $("ubody").innerHTML = ""; $("password").value = "";
    $("authView").classList.remove("hidden");
    $("appView").classList.add("hidden");
    $("appHeader").classList.add("hidden");
    $("usersCard").classList.add("hidden");
    $("viewCarriles").classList.add("hidden");
    $("adminNav").classList.add("hidden");
    carriles = []; $("cbody").innerHTML = "";
    return;
  }

  $("userEmail").textContent = session.user.email;
  await cargarRol(uid);
  aplicarRol();
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("appHeader").classList.remove("hidden");
  cancelarEdicion();
  cargar();
}

/* ---------- Roles ---------- */
async function cargarRol(uid) {
  const { data, error } = await sb.from("perfiles").select("rol").eq("id", uid).maybeSingle();
  if (error) console.warn("No se pudo leer el rol (¿ejecutaste el schema.sql actualizado?):", error.message);
  miRol = (!error && data && data.rol === "admin") ? "admin" : "usuario";
}

function columnas() {
  const adm = esAdmin();
  return ["Correlativo", adm && "Usuario", "Nombre y apellido", "Puesto", "Garita", "Fecha y hora de registro",
          "Titulo Incidencia", "Detalle", adm && "Funciones"].filter(Boolean);
}

function aplicarRol() {
  const adm = esAdmin();
  const b = $("rolBadge");
  b.textContent = adm ? "Administrador" : "Usuario";
  b.className = "badge " + (adm ? "badge-admin" : "badge-user");
  $("tituloLista").textContent = adm ? "Todas las incidencias" : "Mis incidencias";
  $("adminNav").classList.toggle("hidden", !adm);
  if (adm) {
    irA("todas");                                  // el administrador entra a "Todas las incidencias"
  } else {
    $("viewNueva").classList.remove("hidden");     // el usuario normal ve su formulario y sus incidencias
    $("viewTodas").classList.remove("hidden");
    $("usersCard").classList.add("hidden");
    $("viewCarriles").classList.add("hidden");
  }
  $("thead").innerHTML = "<tr>" + columnas().map(t => "<th>" + t + "</th>").join("") + "</tr>";
}

/* ---------- Incidencias ---------- */
async function cargar() {
  msg($("listMsg"), "Cargando…");
  // Un usuario normal recibe solo sus incidencias (lo garantiza la base de datos).
  const campos = esAdmin() ? "*, perfiles(email)" : "*";
  const { data, error } = await sb.from("incidencias").select(campos).order("correlativo", { ascending: false });
  if (error) return msg($("listMsg"), "Error al cargar: " + error.message, "err");
  datos = data; msg($("listMsg"), ""); pintar();
}

function pintar() {
  const adm = esAdmin();
  const q = $("buscar").value.trim().toLowerCase();
  const filas = datos.filter(r =>
    !q || [fmtCorrelativo(r.correlativo), r.perfiles && r.perfiles.email, r.nombre, r.apellido, r.puesto, r.garita, r.incidencia, r.detalle]
      .join(" ").toLowerCase().includes(q));
  const vacio = adm ? "Sin registros." : "Aún no has registrado incidencias.";
  $("tbody").innerHTML = filas.map(r => `
    <tr>
      <td class="tag">${fmtCorrelativo(r.correlativo)}</td>
      ${adm ? `<td>${esc(r.perfiles && r.perfiles.email)}</td>` : ""}
      <td>${esc(r.nombre)} ${esc(r.apellido)}</td>
      <td>${esc(r.puesto)}</td>
      <td>${esc(r.garita)}</td>
      <td>${fmtFecha(r.fecha_hora)}</td>
      <td>${esc(r.incidencia)}</td>
      <td class="det">${esc(r.detalle)}</td>
      ${adm ? `<td class="acts">
        <button class="btn-edit" data-edit="${r.correlativo}">Editar</button>
        <button class="btn-del" data-del="${r.correlativo}">Eliminar</button>
      </td>` : ""}
    </tr>`).join("") || `<tr><td class="empty" colspan="${columnas().length}">${vacio}</td></tr>`;
}

$("buscar").oninput = pintar;

$("tbody").onclick = e => {
  if (!esAdmin()) return;
  const del = e.target.closest("[data-del]");
  if (del) return eliminar(Number(del.dataset.del));

  const b = e.target.closest("[data-edit]");
  if (!b) return;
  const r = datos.find(x => x.correlativo === Number(b.dataset.edit));
  if (!r) return;
  editando = r.correlativo;
  $("formTitle").textContent = "Editando " + fmtCorrelativo(r.correlativo);
  $("fCorrelativo").value = fmtCorrelativo(r.correlativo);
  $("fFecha").value = fmtFecha(r.fecha_hora);
  $("fNombre").value = r.nombre; $("fApellido").value = r.apellido;
  $("fPuesto").value = r.puesto || "";
  $("fGarita").value = r.garita || "";
  $("fIncidencia").value = r.incidencia; $("fDetalle").value = r.detalle;
  $("btnGuardar").textContent = "Guardar cambios";
  $("btnCancelar").classList.remove("hidden");
  irA("nueva");
};

async function eliminar(correlativo) {
  const r = datos.find(x => x.correlativo === correlativo);
  if (!r) return;
  const ok = confirm(
    "¿Eliminar la incidencia " + fmtCorrelativo(correlativo) + " de " + r.nombre + " " + r.apellido + "?\n\n" +
    "Esta acción no se puede deshacer."
  );
  if (!ok) return;

  const { data, error } = await sb.from("incidencias").delete().eq("correlativo", correlativo).select();
  if (error) return msg($("listMsg"), "No se pudo eliminar: " + error.message, "err");
  if (!data || data.length === 0) {
    return msg($("listMsg"), "No se eliminó: tu usuario no tiene permiso de administrador en la base de datos.", "err");
  }
  if (editando === correlativo) { cancelarEdicion(); msg($("formMsg"), ""); }
  datos = datos.filter(x => x.correlativo !== correlativo);
  pintar();
  msg($("listMsg"), "Incidencia " + fmtCorrelativo(correlativo) + " eliminada.", "ok");
}

function cancelarEdicion() {
  editando = null;
  $("incForm").reset();
  $("formTitle").textContent = "Nueva incidencia";
  $("fCorrelativo").value = "Se asigna al guardar";
  $("fFecha").value = "Se registra al guardar";
  $("btnGuardar").textContent = "Guardar incidencia";
  $("btnCancelar").classList.add("hidden");
}
$("btnCancelar").onclick = () => { cancelarEdicion(); msg($("formMsg"), ""); irA("todas"); };

$("incForm").onsubmit = async e => {
  e.preventDefault();
  const campos = {
    nombre: $("fNombre").value.trim(),
    apellido: $("fApellido").value.trim(),
    puesto: $("fPuesto").value.trim(),
    garita: $("fGarita").value,
    incidencia: $("fIncidencia").value.trim(),
    detalle: $("fDetalle").value.trim()
  };
  $("btnGuardar").disabled = true;
  let error;
  if (editando === null) {
    ({ error } = await sb.from("incidencias").insert(campos));
  } else if (esAdmin()) {
    ({ error } = await sb.from("incidencias").update(campos).eq("correlativo", editando));
  } else {
    error = { message: "Solo un administrador puede editar incidencias." };
  }
  $("btnGuardar").disabled = false;
  if (error) return msg($("formMsg"), "No se pudo guardar: " + error.message, "err");
  const eraEdicion = editando !== null;
  cancelarEdicion();
  await cargar();
  if (eraEdicion) {                                // al terminar de editar, volver a la lista
    msg($("formMsg"), "");
    irA("todas");
    msg($("listMsg"), "Cambios guardados.", "ok");
  } else {
    msg($("formMsg"), "Incidencia registrada.", "ok");
  }
};

/* ---------- Usuarios y roles (solo administrador) ---------- */
async function cargarUsuarios() {
  msg($("usersMsg"), "Cargando…");
  const { data, error } = await sb.from("perfiles").select("id, email, rol").order("email");
  if (error) return msg($("usersMsg"), "Error al cargar usuarios: " + error.message, "err");
  perfiles = data; msg($("usersMsg"), ""); pintarUsuarios();
}

function pintarUsuarios() {
  $("ubody").innerHTML = perfiles.map(p => {
    const yo = p.id === usuarioActual;
    return `
    <tr>
      <td>${esc(p.email)}${yo ? ' <span class="me">(tú)</span>' : ""}</td>
      <td>
        <select data-rol-uid="${esc(p.id)}" ${yo ? "disabled" : ""}>
          <option value="usuario" ${p.rol === "usuario" ? "selected" : ""}>Usuario</option>
          <option value="admin" ${p.rol === "admin" ? "selected" : ""}>Administrador</option>
        </select>
      </td>
      <td class="acts">${yo ? "" : `<button class="btn-edit" data-save-rol="${esc(p.id)}">Guardar rol</button>`}</td>
    </tr>`;
  }).join("") || `<tr><td class="empty" colspan="3">Sin usuarios.</td></tr>`;
}

$("ubody").onclick = async e => {
  const b = e.target.closest("[data-save-rol]");
  if (!b || !esAdmin()) return;
  const id = b.dataset.saveRol;
  const p = perfiles.find(x => x.id === id);
  const sel = document.querySelector('select[data-rol-uid="' + id + '"]');
  if (!p || !sel) return;
  const nuevo = sel.value;
  if (nuevo === p.rol) return msg($("usersMsg"), "Ese usuario ya tiene ese rol.", "");

  const texto = nuevo === "admin"
    ? "¿Dar permisos de ADMINISTRADOR a " + p.email + "?\n\nPodrá ver, editar y eliminar todas las incidencias."
    : "¿Cambiar a " + p.email + " a usuario normal?\n\nSolo podrá crear y ver sus propias incidencias.";
  if (!confirm(texto)) { sel.value = p.rol; return; }

  const { data, error } = await sb.from("perfiles").update({ rol: nuevo }).eq("id", id).select();
  if (error) return msg($("usersMsg"), "No se pudo cambiar el rol: " + error.message, "err");
  if (!data || data.length === 0) return msg($("usersMsg"), "No se pudo cambiar el rol: permiso denegado.", "err");
  p.rol = nuevo;
  pintarUsuarios();
  msg($("usersMsg"), "Rol de " + p.email + " actualizado.", "ok");
};

/* ---------- Carriles de cada garita (solo administrador) ---------- */
const GARITAS = ["Garita 1", "Garita 2", "Garita 3", "Garita 4"];

async function cargarCarriles() {
  msg($("carMsg"), "Cargando…");
  const { data, error } = await sb.from("carriles").select("id, nombre, garita, creado_en");
  if (error) {
    const falta = /carriles/i.test(error.message) && /(schema cache|does not exist|relation)/i.test(error.message);
    return msg($("carMsg"), falta
      ? "Falta crear la tabla de carriles: ejecuta el schema.sql actualizado en Supabase."
      : "Error al cargar carriles: " + error.message, "err");
  }
  carriles = data; msg($("carMsg"), ""); pintarCarriles();
}

function pintarCarriles() {
  const f = $("cFiltro").value;
  const orden = (a, b) => a.garita.localeCompare(b.garita) || a.nombre.localeCompare(b.nombre, "es", { numeric: true });
  const filas = carriles.filter(c => !f || c.garita === f).sort(orden);

  $("cResumen").innerHTML = GARITAS.map(g => {
    const n = carriles.filter(c => c.garita === g).length;
    return `<span class="chip">${g}: <b>${n}</b> ${n === 1 ? "carril" : "carriles"}</span>`;
  }).join("");

  const vacio = f ? "Esta garita aún no tiene carriles." : "Aún no hay carriles registrados.";
  $("cbody").innerHTML = filas.map(c => `
    <tr>
      <td>${esc(c.garita)}</td>
      <td><b>${esc(c.nombre)}</b></td>
      <td>${fmtFecha(c.creado_en)}</td>
      <td class="acts"><button class="btn-del" data-del-car="${esc(c.id)}">Eliminar</button></td>
    </tr>`).join("") || `<tr><td class="empty" colspan="4">${vacio}</td></tr>`;
}

$("cFiltro").onchange = pintarCarriles;

$("carForm").onsubmit = async e => {
  e.preventDefault();
  if (!esAdmin()) return;
  const nombre = $("cNombre").value.trim().replace(/\s+/g, " ");
  const garita = $("cGarita").value;
  if (!nombre) return msg($("carFormMsg"), "Escribe el nombre del carril.", "err");
  if (!garita) return msg($("carFormMsg"), "Selecciona la garita a la que pertenece el carril.", "err");

  $("btnAddCarril").disabled = true;
  const { error } = await sb.from("carriles").insert({ nombre, garita });
  $("btnAddCarril").disabled = false;
  if (error) {
    if (error.code === "23505") return msg($("carFormMsg"), "Ya existe el carril \u201c" + nombre + "\u201d en " + garita + ".", "err");
    const falta = /carriles/i.test(error.message) && /(schema cache|does not exist|relation)/i.test(error.message);
    return msg($("carFormMsg"), falta
      ? "Falta crear la tabla de carriles: ejecuta el schema.sql actualizado en Supabase."
      : "No se pudo agregar el carril: " + error.message, "err");
  }
  msg($("carFormMsg"), "Carril \u201c" + nombre + "\u201d agregado a " + garita + ".", "ok");
  $("cNombre").value = "";       // la garita queda seleccionada para agregar varios carriles seguidos
  $("cNombre").focus();
  cargarCarriles();
};

$("cbody").onclick = e => {
  const b = e.target.closest("[data-del-car]");
  if (b && esAdmin()) eliminarCarril(b.dataset.delCar);
};

async function eliminarCarril(id) {
  const c = carriles.find(x => String(x.id) === String(id));
  if (!c) return;
  const ok = confirm("\u00bfEliminar el carril \u201c" + c.nombre + "\u201d de " + c.garita + "?\n\nEsta acci\u00f3n no se puede deshacer.");
  if (!ok) return;
  const { data, error } = await sb.from("carriles").delete().eq("id", c.id).select();
  if (error) return msg($("carMsg"), "No se pudo eliminar: " + error.message, "err");
  if (!data || data.length === 0) return msg($("carMsg"), "No se elimin\u00f3: tu usuario no tiene permiso de administrador en la base de datos.", "err");
  carriles = carriles.filter(x => String(x.id) !== String(id));
  pintarCarriles();
  msg($("carMsg"), "Carril \u201c" + c.nombre + "\u201d eliminado de " + c.garita + ".", "ok");
}
</script>
